[project]
name = "scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "scrapy>=2.20.0",
    "sqlalchemy>=2.1.9",
]


[tool.uv]
package = true

[project.scripts]
scraper-diario = "scraper.cli:run_diario"
sync-database = "scraper.cli:sync_database"
sync-storage = "scraper.cli:sync_storage"
sync-environment = "scraper.cli:sync_environment"


[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
